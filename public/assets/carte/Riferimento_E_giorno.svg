</tspan><tspan x="-424.078" y="-932.052">     se il precedente è morto
</tspan><tspan x="-424.078" y="-927.534">2) Il villaggio discute i propri sospetti
</tspan><tspan x="-424.078" y="-923.015">3) Procedendo in senso orario a partire 
</tspan><tspan x="-424.078" y="-918.497">     dall&apos;ultimo morto,  ciascun personaggio </tspan><tspan x="-424.078" y="-913.979">vivo 
</tspan><tspan x="-424.078" y="-909.46">     vota chi mandare al rogo. Chi ottiene la
</tspan><tspan x="-424.078" y="-904.942">     maggioranza dei voti viene giustizziato
</tspan><tspan x="-424.078" y="-900.424">4) In caso di pareggio, chi ha ricevuto più </tspan><tspan x="-424.078" y="-895.905">voti ha
</tspan><tspan x="-424.078" y="-891.387">     diritto a difendersi. In seguito tutti, anche </tspan><tspan x="-424.078" y="-886.869">i
</tspan><tspan x="-424.078" y="-882.351">     morti, votano per alzata di mano. 
</tspan><tspan x="-424.078" y="-877.832">Nel frattempo, se si verificano le condizioni:
</tspan><tspan x="-424.078" y="-873.314">1 ) Conferma l&apos;esecuzione del <tspan style="font-style:italic">Boia</tspan>
</tspan><tspan x="-424.078" y="-868.796">2 ) Valida la morte di un personaggio (<tspan style="font-style:italic">Scemo </tspan></tspan><tspan x="-424.078" y="-864.277"><tspan style="font-style:italic">del 
