</tspan><tspan x="-424.078" y="-927.534">     se ciò avviene fai calare la notte
</tspan><tspan x="-424.078" y="-923.015">2) Comunica chi è morto durante la notte
</tspan><tspan x="-424.078" y="-918.497">3) Rendi noto se qualcuno è resuscitato
</tspan><tspan x="-424.078" y="-913.979">4) Annuncia se qualche fazione ha vinto
</tspan><tspan x="-424.078" y="-909.46">5) Dichiara che si sentono dei belati se il </tspan><tspan x="-424.078" y="-904.942"><tspan style="font-style:italic;-inkscape-font-specification:&quot;Candara Italic&quot;">Pastore</tspan> 
</tspan><tspan x="-424.078" y="-900.424">     è vicino ad un <tspan style="font-style:italic;-inkscape-font-specification:&quot;Candara Italic&quot;">Lupo Mannaro
</tspan></tspan><tspan x="-424.078" y="-895.905"><tspan style="font-style:italic;-inkscape-font-specification:&quot;Candara Italic&quot;">6) </tspan>Se l&apos;<tspan style="font-style:italic;-inkscape-font-specification:&quot;Candara Italic&quot;">Ambasciatore</tspan> è vivo ed il <tspan style="font-style:italic;-inkscape-font-specification:&quot;Candara Italic&quot;">Veggente</tspan> ha 
</tspan><tspan x="-424.078" y="-891.387">     indagato un abitante del villaggio, </tspan><tspan x="-424.078" y="-886.869">annuncialo
</tspan><tspan x="-424.078" y="-882.351">7) Fai agire il <tspan style="font-style:italic;-inkscape-font-specification:&quot;Candara Italic&quot;">Fantasma Onniscente</tspan>
