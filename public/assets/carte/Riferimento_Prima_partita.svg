<svg xmlns="http://www.w3.org/2000/svg" width="287.245" height="476.219" viewBox="0 0 76 126"><defs><path id="a" d="M-1517.098 1142.154h109.248v34.118h-109.248z"/><path id="b" d="M-425-941h93.176v85.002H-425z"/></defs><path d="M-326.06 491.183v75.582h44.09v-75.582h-41.92z" style="fill:#191f27;fill-opacity:1;stroke:#191f27;stroke-width:3.77914;stroke-linecap:round;stroke-linejoin:miter;stroke-miterlimit:3.3;stroke-dasharray:none;stroke-opacity:1;paint-order:markers stroke fill" transform="translate(520.675 -776.833)scale(1.58766)"/><path d="M773.671 118.269h63.062a3.46 3.46 0 0 1 3.47 3.469V234.8a3.46 3.46 0 0 1-3.47 3.469h-63.062a3.46 3.46 0 0 1-3.469-3.47V121.739a3.46 3.46 0 0 1 3.469-3.47" style="fill:#fff;fill-opacity:1;stroke:none;stroke-width:.204378;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:3.3;stroke-opacity:1" transform="matrix(.9 0 0 .94166 -686.675 -104.869)"/><text xml:space="preserve" x="-460.463" y="368.703" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:4.61444px;line-height:3.9px;font-family:&quot;Franklin Gothic Medium Cond&quot;;-inkscape-font-specification:&quot;Franklin Gothic Medium Cond&quot;;text-align:center;letter-spacing:0;word-spacing:0;writing-mode:lr-tb;direction:ltr;text-anchor:middle;fill:#191f27;fill-opacity:1;stroke:none;stroke-width:1.30803;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:3.3;paint-order:fill markers stroke" transform="translate(768.89 -566.843)scale(1.58766)"><tspan x="-460.463" y="368.703" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;line-height:3.9px;font-family:Impact;-inkscape-font-specification:Impact;letter-spacing:0;word-spacing:0;fill:#191f27;fill-opacity:1;stroke-width:1.30803">LA PRIMA PARTITA</tspan></text><text xml:space="preserve" x="-52.945" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:7.69px;line-height:8.88943px;font-family:Candara;-inkscape-font-specification:Candara;text-align:start;letter-spacing:0;word-spacing:0;writing-mode:lr-tb;direction:ltr;text-orientation:upright;white-space:pre;shape-inside:url(#a);display:inline;fill:#191f27;fill-opacity:1;stroke:none;stroke-width:3.83622;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:3.3;paint-order:markers stroke fill" transform="translate(656.963 -459.922)scale(.42007)"><tspan x="-1517.098" y="1148.79">Cosa fare se sei il narratore</tspan></text><text xml:space="preserve" x="-89.455" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:4.38341px;line-height:4.51833px;font-family:Candara;-inkscape-font-specification:Candara;text-align:start;letter-spacing:0;word-spacing:0;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#b);shape-padding:.922368;display:inline;fill:#191f27;fill-opacity:1;stroke:none;stroke-width:4.53543;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:3.3;paint-order:fill markers stroke" transform="translate(242.909 566.164)scale(.52707)"><tspan x="-424.078" y="-936.57">1) Comunica chi è morto durante la notte
</tspan><tspan x="-424.078" y="-932.052">2) Conta segretamente quanti <tspan style="font-style:italic">Lupi Mannari </tspan></tspan><tspan x="-424.078" y="-927.534">sono 
</tspan><tspan x="-424.078" y="-923.015">     ancora in vita: se tutti i lupi sono morti il 
</tspan><tspan x="-424.078" y="-918.497">     villaggio avrà vinto; se invece i lupi sono </tspan><tspan x="-424.078" y="-913.979">in 
</tspan><tspan x="-424.078" y="-909.46">     tanti quanti gli altri abitanti del villaggio, i </tspan><tspan x="-424.078" y="-904.942">lupi 
</tspan><tspan x="-424.078" y="-900.424">     avrano la meglio
</tspan><tspan x="-424.078" y="-895.905">3) Il villaggio discute liberamente i propri 
</tspan><tspan x="-424.078" y="-891.387">     sospetti e si prepara a votare
</tspan><tspan x="-424.078" y="-886.869">4) Procedendo in senso orario a partire 
</tspan><tspan x="-424.078" y="-882.351">     dall&apos;ultimo morto,  ciascun personaggio </tspan><tspan x="-424.078" y="-877.832">vivo 
</tspan><tspan x="-424.078" y="-873.314">     vota chi mandare al rogo. Chi ottiene la
</tspan><tspan x="-424.078" y="-868.796">     maggioranza dei voti viene giustizziato
</tspan><tspan x="-424.078" y="-864.277">5) In caso di pareggio, i giocatori con il </tspan><tspan x="-424.078" y="-859.759">maggior 
</tspan><tspan x="-424.078" y="-855.241">     </tspan><tspan x="-424.078" y="-853.412"><tspan dx="0 2.7089391 2.7089391 4.0984859 2.4722395 1.7226706 2.6519613 1.139679 2.695797 1.1309166 1.139679 2.2267704 2.6519604 1.5824032 1.1309166 1.139679 2.7089405 2.4590874 2.7089386 2.7089386 2.6519623 1.139679 2.695797 1.1309166 1.8103409 1.1309166 1.5824013 1.5824051 2.6519623 1.139679 2.4590874 1.139679 2.695797 1.1309128 1.5078964 2.4722366 2.7089386 2.6958008 2.4722366 1.8103409 2.0996475 1.1309128 1.1396866">numero di voti hanno diritto a difendersi 
</tspan></tspan><tspan x="-424.078" y="-848.894"><tspan dx="0 1.1396792 1.1396792 1.1396792 1.1396792 1.139679 2.0996456 2.695796 1.1309175 2.4722395 2.695797 2.4590874 2.7089386 2.695797 2.6519604 1.1396809 2.6957951 2.4722404 1.7226715 2.1040344 2.7089386 2.4722404 1.139679 2.0996437 2.6519623 2.7089386 2.6519623 1.139679 1.1309166 2.7089386 2.7089386 2.6519623 2.1040344 2.4722366 2.7089386 1.5824051 1.1309204 1.1747513 1.139679 1.4859695 2.7089386 1.139679 2.0996475 2.4722366 2.6958008 2.7089386 1.1309128 1.5824051 2.6519623 1.139679">     spiegando perchè sono innocenti. In seguito 
</tspan></tspan><tspan x="-424.078" y="-844.375"><tspan dx="0 1.1396792 1.1396792 1.1396792 1.1396792 1.139679 1.5824032 2.7089396 1.5824022 1.5824032 1.1309175 1.1747522 1.139678 2.4590893 2.7089386 2.1040363 2.7089386 2.4722385 1.1396809 1.1309166 1.139679 4.098484 2.6519623 1.8103409 1.5824013 1.1309204 1.1747513 1.139679 2.2267685 2.6519623 1.5824013 2.4590912 2.7089386 2.6519585 1.1396828 2.695797 2.4722366 1.8103409 1.139679 2.4590912 1.1309128 2.0602036 2.4590836 1.5824051 2.4590912 1.139679 2.6957932 1.1309204 1.139679 4.0984879 2.4590836 2.7089386 2.6519623 1.1747513">     tutti, anche i morti, votano per alzata di mano.
</tspan></tspan><tspan x="-424.078" y="-839.857"><tspan dx="0 2.5073044 1.3150196 1.1396792 2.8009987 1.1309171 1.139679 1.5824032 2.4722395 1.8103409 4.098485 1.1309185 2.7089386 2.4722404 1.139679 2.6957951 2.4722404 1.1309166 1.139679 1.7226715 2.6519623 2.6957932 2.6519623 1.139679 2.4590874 2.7089424 2.7089386 2.7089386 2.7089386 2.1040344 1.1309166 2.4590874 1.139679 2.1040344 2.7089386 2.4722443 1.139679 2.0996475 1.5823975 2.4590912 1.139679 2.1040344 2.4590912 1.1309128 2.4590912 2.7089386 2.6957932 2.6519623 1.139679">6) Al termine del rogo annuncia che sta calando 
</tspan></tspan><tspan x="-424.078" y="-835.339"><tspan dx="0 1.1396792 1.1396792 1.1396792 1.1396792 1.139679 1.1309175 2.4590883 1.139679 2.7089396 2.6519604 1.5824032 1.5824032">     la notte</tspan></tspan></text><path d="M-358.224 317.458a3.086 3.086 0 0 0-3.085 3.082c0 1.7 1.384 3.084 3.085 3.084a3.09 3.09 0 0 0 2.925-2.115v.006s.244-.736.736-.813h28.813a.16.16 0 0 0 .16-.162.16.16 0 0 0-.16-.16h-28.81c-.494-.075-.739-.815-.739-.815v.005a3.09 3.09 0 0 0-2.925-2.112zm0 .322a2.756 2.756 0 0 1 2.76 2.763 2.76 2.76 0 1 1-2.76-2.763" style="baseline-shift:baseline;display:inline;overflow:visible;vector-effect:none;fill:#191f27;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:3.3;paint-order:markers stroke fill;stop-color:#000" transform="translate(582.277 -440.253)scale(1.58766)"/><text xml:space="preserve" x="-354.506" y="319.856" style="font-size:2.0372px;line-height:3.39449px;font-family:&quot;More Sugar&quot;;-inkscape-font-specification:&quot;More Sugar&quot;;text-align:start;letter-spacing:0;word-spacing:0;writing-mode:lr-tb;direction:ltr;text-orientation:upright;text-anchor:start;fill:#191f27;fill-opacity:1;stroke:#ff1313;stroke-width:1.03925;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:3.3;paint-order:markers stroke fill" transform="translate(582.277 -440.253)scale(1.58766)"><tspan x="-354.506" y="319.856" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:2.0372px;line-height:3.39449px;font-family:Candara;-inkscape-font-specification:Candara;fill:#191f27;fill-opacity:1;stroke:none;stroke-width:1.03925">È giorno nel villaggio...</tspan></text><path d="M-358.23 318.22h-.002c-.004.004-.205.88-.206.896v.003h.001v.001h.004q.006.002.025-.001c.063-.01.232-.012.3-.005l.079.008h.004v-.001h.001l.001-.001.001-.001c.005-.01-.003-.048-.03-.165l-.146-.619a1 1 0 0 0-.03-.114v-.001zm-.905.197c-.002.012.062.413.106.661l.038.221.004.03.054-.03a1.8 1.8 0 0 1 .331-.142c.004-.004-.027-.05-.168-.245l-.197-.273-