</tspan><tspan x="-424.078" y="-932.052">2) Se è la prima notte chiama tutti i ruoli </tspan><tspan x="-424.078" y="-927.534">speciali  
</tspan><tspan x="-424.078" y="-923.015">      (<tspan style="font-style:italic">Lupi mannari, Veggente, ecc.</tspan>) che hai </tspan><tspan x="-424.078" y="-918.497">inserito  
</tspan><tspan x="-424.078" y="-913.979">      nel mazzo e annota a che giocatore 
</tspan><tspan x="-424.078" y="-909.46">      corrispondono
</tspan><tspan x="-424.078" y="-904.942">3) Sveglia, uno alla volta, i ruoli che </tspan><tspan x="-424.078" y="-900.424">agiscono di 
</tspan><tspan x="-424.078" y="-895.905">     notte. Ciascuno a turno apre gli occhi, </tspan><tspan x="-424.078" y="-891.387">agisce     
</tspan><tspan x="-424.078" y="-886.869">     secondo il suo ruolo e poi chiude gli </tspan><tspan x="-424.078" y="-882.351">occhi.     
</tspan><tspan x="-424.078" y="-877.832">     Chiama per primi i ruoli che non </tspan><tspan x="-424.078" y="-873.314">uccidono
</tspan><tspan x="-424.078" y="-868.796">     (<tspan style="font-style:italic">Paladino, Cortigiana, ecc.</tspan>) e termina con 
</tspan><tspan x="-424.078" y="-864.277">     i <tspan style="font-style:italic">Lupi Mannari
</tspan></tspan><tspan x="-424.078" y="-859.759">4) Quando tutti hanno agito puoi </tspan><tspan x="-424.078" y="-853.412"><tspan dx="0 2.4590883 2.7089391 2.7089391 2.7089386 2.7089396 2.1040354 1.1309166 2.4590893 1.7226696 2.4722404 1.139679">annunciare 
